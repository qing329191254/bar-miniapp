services:
  mysql:
    image: mysql:8.4
    container_name: wanka-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wanka
      MYSQL_DATABASE: wanka
      MYSQL_USER: wanka
      MYSQL_PASSWORD: wanka
    ports:
      - "3308:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --sql-mode=STRICT_TRANS_TABLES
    volumes:
      - wanka_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwanka", "-pwanka"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: wanka-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wanka_mysql:
